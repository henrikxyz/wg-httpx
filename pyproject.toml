[project]
name = "wg-httpx"
version = "0.1.0"
description = "Route individual HTTPX clients through a userspace WireGuard tunnel"
readme = "README.md"
authors = [
    { name = "Henrik", email = "295322314+henrikxyz@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = "MIT"
keywords = ["httpx", "wireguard", "vpn", "socks5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx[http2,socks]>=0.27,<1",
]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/wg_httpx"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
